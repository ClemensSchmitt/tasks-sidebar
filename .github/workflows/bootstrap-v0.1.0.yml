name: Bootstrap verified v0.1.0 release

on:
  push:
    branches:
      - release/bootstrap-v0.1.0

permissions:
  contents: write
  actions: write

jobs:
  bootstrap:
    name: Create immutable tag and dispatch existing release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: 5bcfe126a149bc875dff8f60bd5b987e9846de7e
      RELEASE_TAG: v0.1.0
    steps:
      - name: Confirm main and release do not move or already exist
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$EXPECTED_SHA" ]]; then
            echo "main changed since its successful CI run; refusing to tag it." >&2
            exit 1
          fi

          set +e
          tag_lookup="$(gh api --include "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" 2>&1)"
          tag_result=$?
          release_lookup="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"
          release_result=$?
          set -e
          if [[ $tag_result -eq 0 || $release_result -eq 0 ]]; then
            echo "Tag or release already exists; refusing to overwrite." >&2
            exit 1
          fi
          if ! grep -Eq '^HTTP/[0-9.]+ 404 ' <<< "$tag_lookup" || ! grep -Eq '^HTTP/[0-9.]+ 404 ' <<< "$release_lookup"; then
            echo "Unable to confirm that tag and release are absent." >&2
            exit 1
          fi

      - name: Create tag on the already tested main commit
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" \
            -f "sha=$EXPECTED_SHA" --jq '.ref'

      - name: Dispatch existing verified release workflow with publication enabled
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/dispatches" \
            -f "ref=main" \
            -f "inputs[tag_name]=$RELEASE_TAG" \
            -F "inputs[publish_release]=true"
