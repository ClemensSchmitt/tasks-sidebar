name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Build shared VSIX candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: node --test test/runtime.test.js test/release.test.js test/actions.test.js
      - uses: actions/upload-artifact@v4
        with:
          name: compatibility-candidate
          path: |
            out/
            *.vsix
          if-no-files-found: error
          retention-days: 1

  compatibility:
    needs: build
    name: CI / ${{ matrix.os }} · VS Code ${{ matrix.vscode_version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode_version: "1.85.0"
          - os: ubuntu-latest
            vscode_version: stable
          - os: macos-latest
            vscode_version: "1.85.0"
          - os: macos-latest
            vscode_version: stable
          - os: windows-latest
            vscode_version: "1.85.0"
          - os: windows-latest
            vscode_version: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shared VSIX and compiled extension
        uses: actions/download-artifact@v4
        with:
          name: compatibility-candidate

      - name: Runtime tests
        run: node --test test/runtime.test.js test/release.test.js test/actions.test.js

      - name: VS Code extension-host tests (Linux)
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
        run: xvfb-run -a node test/integration/run.js

      - name: VS Code extension-host tests
        if: runner.os != 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
        run: node test/integration/run.js

      - name: Install and probe VSIX in VS Code (Linux)
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
        run: xvfb-run -a npm run test:vsix

      - name: Install and probe VSIX in VS Code
        if: runner.os != 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
        run: npm run test:vsix

      - name: Upload VSIX installation probe report
        uses: actions/upload-artifact@v4
        with:
          name: vsix-install-probe-${{ matrix.os }}-${{ matrix.vscode_version }}
          path: vsix-install-probe.json
          if-no-files-found: error
          retention-days: 3

  checks:
    name: CI checks
    needs: [build, compatibility]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the build and every compatibility check
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: test "$BUILD_RESULT" = success && test "$COMPATIBILITY_RESULT" = success
