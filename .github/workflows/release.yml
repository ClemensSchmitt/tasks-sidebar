name: Release VSIX

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and compile
        run: npm run check && npm run compile

      - name: Build VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.vsix --repo "${GITHUB_REPOSITORY}" --title "Tasks Sidebar ${GITHUB_REF_NAME}" --generate-notes
