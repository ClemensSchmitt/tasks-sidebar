name: Validate and release VSIX

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: ${{ matrix.os }} · VS Code ${{ matrix.vscode_version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode_version: "1.85.0"
          - os: ubuntu-latest
            vscode_version: stable
          - os: macos-latest
            vscode_version: "1.85.0"
          - os: macos-latest
            vscode_version: stable
          - os: windows-latest
            vscode_version: "1.85.0"
          - os: windows-latest
            vscode_version: stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Runtime tests
        run: npm test

      - name: VS Code extension-host tests (Linux)
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
        run: xvfb-run -a npm run test:extension

      - name: VS Code extension-host tests
        if: runner.os != 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
        run: npm run test:extension

  build:
    name: Build VSIX
    needs: compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: npm run package

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [compatibility, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build VSIX
        run: npm run compile && npx --yes @vscode/vsce package --no-dependencies

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.vsix --repo "${GITHUB_REPOSITORY}" --title "Tasks Sidebar ${GITHUB_REF_NAME}" --generate-notes
