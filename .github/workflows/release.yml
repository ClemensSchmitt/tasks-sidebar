name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing version tag to validate and publish (for example v1.2.3)
        required: true
        type: string
      publish_release:
        description: Publish the verified artifact as a GitHub Release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  RELEASE_REF: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  resolve:
    name: Resolve immutable release commit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "Expected an existing version tag such as v1.2.3; received '$RELEASE_TAG'." >&2
            exit 1
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Resolve release commit
        id: source
        run: echo "sha=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"

  compatibility:
    name: Release validation / ${{ matrix.os }} · VS Code ${{ matrix.vscode_version }}
    needs: [resolve, package]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            vscode_version: "1.85.0"
          - os: ubuntu-latest
            vscode_version: stable
          - os: macos-latest
            vscode_version: "1.85.0"
          - os: macos-latest
            vscode_version: stable
          - os: windows-latest
            vscode_version: "1.85.0"
          - os: windows-latest
            vscode_version: stable
    steps:
      - name: Checkout tested release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shared VSIX and compiled extension
        uses: actions/download-artifact@v4
        with:
          name: compatibility-candidate

      - name: Runtime tests
        run: node --test test/runtime.test.js test/release.test.js

      - name: VS Code extension-host tests (Linux)
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
        run: xvfb-run -a node test/integration/run.js

      - name: VS Code extension-host tests
        if: runner.os != 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
        run: node test/integration/run.js

      - name: Install and probe VSIX in VS Code (Linux)
        if: runner.os == 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
        run: xvfb-run -a npm run test:vsix

      - name: Install and probe VSIX in VS Code
        if: runner.os != 'Linux'
        env:
          VSCODE_VERSION: ${{ matrix.vscode_version }}
        run: npm run test:vsix

      - name: Upload VSIX installation probe report
        uses: actions/upload-artifact@v4
        with:
          name: vsix-install-probe-${{ matrix.os }}-${{ matrix.vscode_version }}
          path: vsix-install-probe.json
          if-no-files-found: error
          retention-days: 3

  package:
    name: Package and verify VSIX
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout tested release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build and verify VSIX
        shell: bash
        run: |
          npm run package
          shopt -s nullglob
          vsix_files=(./*.vsix)
          if [[ ${#vsix_files[@]} -ne 1 ]]; then
            echo "Expected exactly one VSIX, found ${#vsix_files[@]}." >&2
            exit 1
          fi
          node scripts/release.js verify --tag "$RELEASE_TAG" --vsix "${vsix_files[0]}"

      - name: Runtime tests before starting the compatibility matrix
        run: node --test test/runtime.test.js test/release.test.js

      - name: Record tested source commit
        id: source
        env:
          RESOLVED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        shell: bash
        run: |
          source_sha="$(git rev-parse HEAD^{commit})"
          if [[ "$source_sha" != "$RESOLVED_SOURCE_SHA" ]]; then
            echo "Package checkout $source_sha differs from tested source $RESOLVED_SOURCE_SHA." >&2
            exit 1
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Tag: $RELEASE_TAG"
            echo "Commit: $source_sha"
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > release-provenance.txt

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-vsix
          path: |
            *.vsix
            release-provenance.txt
          if-no-files-found: error
          retention-days: 7

      - name: Share the exact release candidate with compatibility tests
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-candidate
          path: |
            out/
            *.vsix
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [resolve, package, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout tested release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0

      - name: Download verified release artifact
        uses: actions/download-artifact@v4
        with:
          name: verified-vsix

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>&1)"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "A GitHub Release for $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          if ! grep -Eq '^HTTP/[0-9.]+ 404 ' <<< "$response"; then
            echo "Could not determine whether release $RELEASE_TAG exists; refusing to publish." >&2
            echo "$response" >&2
            exit 1
          fi

      - name: Confirm tag is unchanged and publish verified VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        shell: bash
        run: |
          checkout_sha="$(git rev-parse HEAD^{commit})"
          if [[ "$checkout_sha" != "$TESTED_SOURCE_SHA" ]]; then
            echo "Publish checkout $checkout_sha differs from tested source $TESTED_SOURCE_SHA." >&2
            exit 1
          fi

          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          current_tag_sha="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$current_tag_sha" != "$TESTED_SOURCE_SHA" ]]; then
            echo "Tag $RELEASE_TAG now points to $current_tag_sha; tests and VSIX used $TESTED_SOURCE_SHA." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" ./*.vsix release-provenance.txt --repo "$GITHUB_REPOSITORY" --title "Tasks Sidebar $RELEASE_TAG" --notes "Verified source commit: $TESTED_SOURCE_SHA" --verify-tag
