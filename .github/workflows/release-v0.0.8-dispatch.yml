name: Dispatch verified v0.0.8 release

# One-time release bootstrap because the existing release pipeline is manual.
# Only the exact manifest bump commit can activate this workflow.
on:
  push:
    branches: [main]
    paths: [package.json, '.github/workflows/release-v0.0.8-dispatch.yml']

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    if: ${{ github.event.head_commit.message == 'chore(release): prepare v0.0.8' || github.event.head_commit.message == 'fix(release): repair dispatcher' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate version and publish immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.0.8"
          test "$(node -p "require('./package-lock.json').version")" = "0.0.8"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.0.8"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin refs/tags/v0.0.8 >/dev/null; then
            echo "Refusing to change an existing v0.0.8 tag" >&2
            exit 1
          fi
          git tag v0.0.8 "$GITHUB_SHA"
          git push origin refs/tags/v0.0.8
          gh workflow run release.yml --ref main -f tag_name=v0.0.8 -f publish_release=true
