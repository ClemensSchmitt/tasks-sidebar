name: Dispatch verified v0.0.9 release

# One-time bootstrap, removed after the verified release has been published.
on:
  push:
    branches: [main]
    paths: [package.json, '.github/workflows/release-v0.0.9-dispatch.yml']

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate version and dispatch immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.0.9"
          test "$(node -p "require('./package-lock.json').version")" = "0.0.9"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "0.0.9"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if git ls-remote --exit-code --tags origin refs/tags/v0.0.9 >/dev/null; then
            echo "Refusing to change an existing v0.0.9 tag" >&2
            exit 1
          fi
          git tag v0.0.9 "$GITHUB_SHA"
          git push origin refs/tags/v0.0.9
          gh workflow run release.yml --ref main -f tag_name=v0.0.9 -f publish_release=true
